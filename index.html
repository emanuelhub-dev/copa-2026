<!DOCTYPE html>
<html lang="pt-BR">
 <link rel="icon" type="image/png" href="logo-copa.png"> 
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copa do Mundo 2026</title>

  <link rel="stylesheet" href="style.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="background-glow"></div>

    <header>
  <div>
    <h1>COPA 2026</h1>
    <p>Fase de grupos • 11 Junho → 27 Junho</p>
  </div>

  <div class="live-box">
      <span class="live-dot"></span>
      Jogos do Dia
    </div>
  </header>

  <main>

    <section class="matches-section">
      <div class="section-title">
        <h2>Partidas</h2>
      </div>

      <div class="matches-grid" id="matchesContainer"></div>
    </section>


    <section class="stats-section">

      <div class="table-card">
        <div class="section-title">
          <h2>Artilharia</h2>
        </div>

        <table>
          <thead>
            <tr>
              <th>Jogador</th>
              <th>Gols</th>
            </tr>
          </thead>

          <tbody id="goalsTable"></tbody>
        </table>
      </div>


      <div class="table-card">
        <div class="section-title">
          <h2>Assistências</h2>
        </div>

        <table>
          <thead>
            <tr>
              <th>Jogador</th>
              <th>Assist.</th>
            </tr>
          </thead>

          <tbody id="assistsTable"></tbody>
        </table>
      </div>

    </section>
   <button id="clearStats" class="save-btn">
  Limpar Estatísticas
</button>
  </main>

<script src="script.js"></script>
</body>

</html>
